<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 30" width="100%" xmlns:c2pa="http://c2pa.org/manifest">
<defs><linearGradient id="d" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF2E88" stop-opacity="0"/><stop offset="0.5" stop-color="#FF4FA3"/><stop offset="1" stop-color="#C084FC" stop-opacity="0"/></linearGradient>
<filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<line x1="0" y1="15" x2="1000" y2="15" stroke="url(#d)" stroke-width="2"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/></line>
<circle r="5" cy="15" fill="#fff" filter="url(#g)"><animate attributeName="cx" values="0;1000" dur="4s" repeatCount="indefinite"/></circle>
<polygon points="500,5 510,15 500,25 490,15" fill="#0D0615" stroke="#FF4FA3" stroke-width="2"><animateTransform attributeName="transform" type="rotate" values="0 500 15;360 500 15" dur="8s" repeatCount="indefinite"/></polygon>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>